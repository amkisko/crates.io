[package]
name = "cargo_credential_crates_io"
version = "0.0.0"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "Cargo credential provider for browser-assisted crates.io login"
publish = false

[lints]
workspace = true

[[bin]]
name = "cargo-credential-crates-io"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
cargo-credential = "=0.4.10"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
fd-lock = "=4.0.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
tempfile = "=3.27.0"
url = "=2.5.8"

[dev-dependencies]
httpmock = "=0.8.3"
